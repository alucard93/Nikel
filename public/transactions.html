  <!DOCTYPE html>
  <html lang="pt">
    <head>
      <meta charset="UTF-8" />
      <meta http-equiv="X-UA-Compatible" content="IE=edge" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
      />
      <link rel="stylesheet" href="./css/styles.css" />
      <title>Nikel - Transactions</title>
    </head>
    <body id="login">
      <main>
        <div class="container">
          <div class="row vh-100">
            <!-- SEÇÃO TEXTO E IMAGENS -->
            <div class="col d-flex justify-content-center flex-column my-5">
              <div class="text-login">
                <p>Organize suas finanças de uma forma fácil.</p>
                <p>Controle seu dinheiro e investimentos.</p>
                <p>Economize e atinja seus objetivos.</p>
              </div>
              <figure class="text-center">
                <img
                  src="./assets/images/pocket.png"
                  alt="imagem pocket"
                  class="img-fluid"
                />
                <img
                  src="./assets/images/coins.png"
                  alt="imagem coins"
                  class="img-fluid d-none d-md-inline coins"
                />
              </figure>
            </div>

            <!-- FORMULÁRIO -->
            <div class="col d-flex justify-content-center flex-column my-5">
              <div class="container">
                <div class="row">
                  <div class="col">
                    <figure class="text-center mb-3">
                      <img
                        src="./assets/images/nikel-logo.png"
                        alt="logo"
                        class="img-fluid"
                      />
                    </figure>
                  </div>
                </div>

                <div class="row">
                  <div class="col">
                    <form action="home.html">
                      <div class="form-group">
                        <label for="exampleInputEmail1">E-mail</label>
                        <input
                          type="email"
                          class="form-control"
                          id="exampleInputEmail1"
                          aria-describedby="emailHelp"
                        />
                        <small id="emailHelp" class="form-text text-muted"
                          >Utilize seu e-mail para realizar o login.</small
                        >
                      </div>
                      <div class="form-group">
                        <label for="exampleInputPassword1">Senha</label>
                        <input
                          type="password"
                          class="form-control"
                          id="exampleInputPassword1"
                        />
                      </div>
                      <div class="form-group form-check">
                        <input
                          type="checkbox"
                          class="form-check-input"
                          id="exampleCheck1"
                        />
                        <label class="form-check-label" for="exampleCheck1"
                          >Permanecer logado</label
                        >
                      </div>
                      <button type="submit" class="btn button-login mt-4">
                        Entrar
                      </button>
                    </form>
                  </div>
                </div>

                <div class="row">
                  <div class="col">
                    <p class="text-center mt-2 form-text">
                      Ainda não tem conta?
                      <a href="register.html">Criar uma conta</a>
                    </p>
                  </div>
                </div>

              <div class="row text-center mt-5">
                <div class="col">
                  <figure>
                    <img src="./assets/images/codai-logo.png" alt="logo codai" class="img-fluid">
                  </figure>
                </div>
              </div>
              <div class="row text-center">
                    <div class="col">
                  <figure>
                    <img src="./assets/images/growdev-logo.png" alt="logo growdev" class="img-fluid">
                  </figure>
                </div>
              </div>

            </div>
          </div>
        </div>
      </main>

      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
  </html>
