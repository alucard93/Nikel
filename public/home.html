<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="./css/styles.css" />
    <title>Nikel - Home</title>
  </head>
  <body id="app">
    <!-- HEADER -->
    <header>
      <nav class="navbar navbar-expand navbar-light bg-white px-4">
        <a class="navbar-brand" href="#">
          <img src="./assets/images/nikel-logo.png" alt="Nikel Logo" />
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Alternar navegação"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div
          class="collapse navbar-collapse justify-content-end"
          id="navbarSupportedContent"
        >
          <div class="d-flex">
            <a href="home.html" class="text-decoration-none">
              <button class="btn color-secondary fs-4" type="button">
                <i class="bi bi-house-door-fill"></i>
              </button>
            </a>
            <a href="transactions.html">
              <button class="btn fs-4" type="button">
                <i class="bi bi-currency-exchange"></i>
              </button>
            </a>

            <div class="dropdown">
              <button
                class="btn fs-4"
                type="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                <i class="bi bi-person-circle"></i>
              </button>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">Sair</a></li>
              </ul>
            </div>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <div class="container-lg">
        <div class="row">
          <div class="col d-flex mt-4 justify-content-start align-items-center">
            <i class="bi bi-cash-coin color-primary icon-detail"></i>
            <span class="fs-2">R$ 0, 00</span>
          </div>

          <div class="col d-flex mt-4 justify-content-end">
            <figure class="text-center">
              <img src="./assets/images/coins-small.png" alt="moedas" />
            </figure>
          </div>
        </div>

        <div class="row">
          <div class="col-12 info shadow-lg">
            <div class="container">
              <div class="row">
                <div class="col-6">
                  <span class="fs-4"
                    >Entradas<i
                      class="bi bi-arrow-down-circle fs-2 align-middle"
                    ></i
                  ></span>
                </div>
                <div class="col-6">
                  <span class="fs-4"
                    >Saídas<i
                      class="bi bi-arrow-up-circle fs-2 align-middle"
                    ></i
                  ></span>
                </div>

                <div class="col-12 my-2">
                  <hr />
                </div>

                <div class="row">
                  <div class="col-6">
                    <div class="container">
                      <div class="row">
                        <div class="col">R$ 1000.00</div>
                      </div>
                    </div>
                  </div>

                  <div class="col-6">
                    <div class="container">
                      <div class="row">
                        <div class="col">R$ 500.00</div>
                      </div>
                    </div>
                  </div>

                  <div class="col-12">
                    <button class="btn button-default" type="button">Ver todas</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
